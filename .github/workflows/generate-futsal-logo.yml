name: Futsal Brand Assets

on:
  push:
    branches:
      - main
    paths:
      - "apps/mobile/assets/branding/futsal-player-logo.webp"
      - "scripts/generate-futsal-logo.py"
      - "scripts/verify-app-branding.mjs"
      - "apps/mobile/app.json"
      - "apps/mobile/src/components/ui/AppHeader.tsx"
      - "apps/mobile/src/components/auth/AuthHero.tsx"
      - ".github/workflows/generate-futsal-logo.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image renderer
        run: python -m pip install --disable-pip-version-check "Pillow==11.3.0"
      - name: Render approved FUTSAL PNG assets
        run: python scripts/generate-futsal-logo.py
      - name: Verify branded assets
        run: node scripts/verify-app-branding.mjs
      - name: Commit generated icon assets to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/assets/icon.png apps/mobile/assets/adaptive-icon.png
          if git diff --cached --quiet; then
            echo "Branded launcher icons already match approved FUTSAL source."
          else
            git commit -m "assets: render approved FUTSAL player logo icons [skip ci]"
            git push origin HEAD:main
          fi
