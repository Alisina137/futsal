name: Temporary Phase 7 Typecheck

on:
  push:
    branches:
      - phase-07-subscription-analytics-admin

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Mobile typecheck
        run: pnpm --filter @leaguekick/mobile typecheck
      - name: API typecheck
        run: pnpm --filter @leaguekick/api typecheck
