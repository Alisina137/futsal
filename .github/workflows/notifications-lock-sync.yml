name: Temporary notification dependencies lockfile sync
on:
  push:
    branches: [notifications-phase1-delivery-events]
    paths:
      - apps/mobile/package.json
      - .github/workflows/notifications-lock-sync.yml
permissions:
  contents: write
jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: notifications-phase1-delivery-events
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
      - run: pnpm install --lockfile-only --no-frozen-lockfile
      - run: |
          if ! git diff --quiet -- pnpm-lock.yaml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "chore(notifications): refresh SDK 57 push dependencies lock"
            git push origin HEAD:notifications-phase1-delivery-events
          fi
