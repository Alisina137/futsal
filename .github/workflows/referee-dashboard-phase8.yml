name: Referee Dashboard Phase 8

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  referee-release:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:referee-dashboard-release-phase8
      - run: pnpm --filter @leaguekick/api exec vitest run test/referee-dashboard-phase8.test.ts test/referee-phase1.test.ts test/referee-phase2.test.ts test/referee-phase3.test.ts
      - run: pnpm --filter @leaguekick/api typecheck
      - run: pnpm --filter @leaguekick/mobile typecheck
